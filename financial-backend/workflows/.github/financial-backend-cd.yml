name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug secrets
        run: |
          echo "Username length: ${#DOCKER_USER}"
          echo "Token length: ${#DOCKER_TOKEN}"
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./financial-backend
          file: ./financial-backend/Dockerfile
          push: true
          tags: aniketjha4518/finance-backend:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean up disk space
        run: |
          docker system prune -af --volumes
          sudo apt clean 2>/dev/null || true

      - name: Pull image from docker hub
        run: docker pull aniketjha4518/finance-backend:latest

      - name: Stop and remove old container
        run: |
          docker stop finance-backend-container || true
          docker rm finance-backend-container || true

      - name: Run docker container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name finance-backend-container \
            --restart unless-stopped \
            -e NODE_ENV="production" \
            -e PORT="3000" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e JWT_EXPIRES_IN="${{ secrets.JWT_EXPIRES_IN }}" \
            aniketjha4518/finance-backend:latest

      - name: Remove old images
        run: docker image prune -af
